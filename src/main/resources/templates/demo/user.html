<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户查询演示</title>
    <style>
        body {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
        }

        form, nav {
            margin: 20px 0;
        }

        input, button {
            padding: 8px;
        }

        a {
            margin-right: 12px;
        }

        dt {
            font-weight: bold;
        }

        dd {
            margin: 4px 0 14px;
        }
    </style>
</head>
<body>
<h1 th:text="${message}">Thymeleaf 初始化成功！</h1>

<form th:action="@{/demo/user/page}" method="get">
    <label for="username">用户名：</label>
    <input id="username" name="username" type="text"
           th:value="${user.username}">
    <button type="submit">查询</button>
</form>

<nav>
    <a th:href="@{/demo/user/page(username='alice')}">查询 alice</a>
    <a th:href="@{/demo/user/page(username='bob')}">查询 bob</a>
</nav>

<dl>
    <dt>ID</dt>
    <dd th:text="${user.id}">1</dd>

    <dt>用户名</dt>
    <dd th:text="${user.username}">alice</dd>

    <dt>显示名称</dt>
    <dd th:text="${user.displayName}">漂泊者 Alice</dd>

    <dt>角色</dt>
    <dd th:text="${user.role}">CUSTOMER</dd>

    <dt>状态</dt>
    <dd th:text="${user.status}">ENABLED</dd>
</dl>
</body>
</html>
