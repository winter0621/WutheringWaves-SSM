<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户查询演示</title>
    <style>
        body {
            width: 520px;
            margin: 42px 0 0 82px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 14px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .table-title {
            margin: 0 0 2px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #d2d2d2;
            padding: 6px 8px;
            text-align: left;
        }

        th {
            width: 125px;
            background: #f3f3f3;
        }

        .query-form {
            margin-top: 26px;
        }

        input {
            width: 108px;
            padding: 2px 4px;
        }

        button {
            margin-left: 4px;
            padding: 2px 7px;
        }

        .quick-links {
            margin-top: 14px;
        }

        .quick-links a {
            margin-left: 8px;
        }
    </style>
</head>
<body>
<h2 th:text="${message}">Thymeleaf 初始化成功！</h2>

<p class="table-title">用户展示信息（不含密码）</p>

<table>
    <tr>
        <th>编号</th>
        <td th:text="${user.id}">1</td>
    </tr>
    <tr>
        <th>登录名</th>
        <td th:text="${user.username}">alice</td>
    </tr>
    <tr>
        <th>显示名称</th>
        <td th:text="${user.displayName}">漂泊者 Alice</td>
    </tr>
    <tr>
        <th>角色</th>
        <td th:text="${user.role}">CUSTOMER</td>
    </tr>
    <tr>
        <th>状态</th>
        <td th:text="${user.status}">ENABLED</td>
    </tr>
</table>

<form class="query-form" th:action="@{/demo/user/page}" method="get">
    <label for="username">登录名：</label>
    <input id="username" name="username" type="text"
           th:value="${user.username}"> 
    <button type="submit">查询</button>
</form>

<p class="quick-links">
    快速切换：
    <a th:href="@{/demo/user/page(username='alice')}">alice</a>
    <a th:href="@{/demo/user/page(username='bob')}">bob</a>
</p>
</body>
</html>
